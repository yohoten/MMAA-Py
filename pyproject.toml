# 依赖与工具配置的唯一来源。
#
#   python -m pip install -r requirements.txt     # 等价于 pip install -e ".[dev]"
#   uv sync --extra dev                           # 使用 uv（见 [tool.uv]）
#
# 只在这里声明直接依赖；传递依赖交给锁定文件（uv lock / pip-compile），
# 不要再把 numpy、python-dateutil、traitlets 之类的间接包逐个钉死。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-modeling-atlas"
version = "0.1.0"
description = "数学建模图谱：43 个 notebook 实践、20 章课件与独立建模案例"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
keywords = ["mathematical-modeling", "optimization", "time-series", "jupyter"]

dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<2.3",
    "scipy>=1.11,<1.14",
    "matplotlib>=3.8,<3.10",
    "scikit-learn>=1.4,<1.6",
    "statsmodels>=0.14,<0.15",
    "networkx>=3.2,<3.5",
    "sympy>=1.12,<1.14",
    "pulp>=2.7,<4",
    "seaborn>=0.13,<0.14",
    "scikit-fuzzy>=0.4.2,<0.6",
    "pmdarima>=2.0.4,<2.1",
    "factor-analyzer>=0.5,<0.6",
    "openpyxl>=3.1,<3.2",
    "tqdm>=4.66,<5",
    "jupyterlab>=4.1,<5",
    "ipython>=8.18,<9",
]

[project.optional-dependencies]
# 仅 10 / 19 / 26 / 29 / 30 / 43 号 notebook 与 modelit 下的深度学习案例需要，按需安装。
ml = [
    "torch>=2.2,<3",
    "tensorflow>=2.15,<3",
    "prophet>=1.1.5,<2",
    "neuralprophet>=0.9,<1",
    "apyori>=1.1.2,<2",
]
dev = [
    "ruff>=0.6",
    "pre-commit>=3.7",
    "nbqa>=1.9",
]

[tool.setuptools]
# 纯 notebook 仓库，不对外发布可导入包；显式置空以避免 setuptools 自动发现目录。
packages = []

[tool.uv]
# uv 不为本仓库构建 wheel，只管理环境。
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "docs",
    "manual",
    "ppts",
    "modelit/Object_classification/cifar-10-batches-py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
# notebook 里常见“先画图后 import”“魔法命令”等情况，避免误报。
"*.ipynb" = ["F811", "F821"]

[tool.ruff.format]
quote-style = "preserve"
